<body class="bg-canvas text-ink font-sans antialiased pb-24 overflow-x-hidden">

          <span id="lval-hum" class="font-display text-sm font-bold text-ink tabular-nums">48%</span>
        </button>

        <button type="button" onclick="selectStream(&#39;sound&#39;)" id="lsat-sound" class="absolute top-1/2 -left-2 -translate-y-1/2 bg-coral-soft border-2 border-white rounded-full px-3 py-1.5 flex items-center gap-1.5 z-20 shadow-md transition-transform">
          <img src="https://lh3.googleusercontent.com/aida/ALJJyrCyBSkHZJ1WonMB5wWYgXLNq1FLG2aqmXeN5TGuK-QIPmYebfX7ZM3YmHWtXPmt1X7_kaEtsEA1G_XEDgqqS7otrOBRO4ulXfzbXfUUStAAdVsGe4IL2k07mvlIL1Y0e584IBsVsf5YSL48zJkQK6uB-F8u7CZF3ofSH9_8w7iuG7qc6ny1jFn2OK7l9QgX7LVuXAm9UA8hTedfWEmYiY7YvqPp0ouloLeSIq7GsgbIV1NqEU4Mu0UF90EiLIY" alt="Sound" class="w-6 h-6 rounded-full object-cover bg-white">
          <span id="lval-sound" class="font-display text-sm font-bold text-ink tabular-nums">42 dBA</span>
        </button>
      </section>

      <!-- Live Wave Card -->
      <section class="w-full rounded-[32px] bg-white border-2 border-lilac p-4 flex flex-col gap-2.5 shadow-[0_10px_28px_rgba(108,60,233,0.08)]">
        <div class="flex items-center justify-between">
          <div>
            <span id="chart-title" class="font-display text-base text-ink block leading-tight">Temperature Stream</span>
            <span id="chart-sub" class="text-[11px] font-bold text-muted">Threshold max: <span class="font-mono text-electric">26.5°C</span></span>
          </div>
          <span id="chart-now" class="rounded-full bg-butter text-butter-ink px-3 py-1 font-display text-sm font-bold tabular-nums">23.4°C</span>

        <svg viewBox="0 0 340 110" class="w-full h-24 overflow-visible" aria-label="Live sensor wave">

          <circle id="wave-dot" cx="326" cy="55" r="5" fill="#6C3CE9" stroke="#FFFFFF" stroke-width="2"></circle>

  <script data-stitch-original-script="61b3c1bf337dd8bb===../../uploads/65ea6de9-2ee9-47ac-bfd5-0a02930ff8c7-61db22.png|||bb85c4b54c8d6b6d===../../uploads/d8681424-c7b9-4070-94d5-6ea55b7b0d30-d4ef4a.png|||aba8a6f893e6072d===../../uploads/a7c9af00-3c36-41bb-a7dc-c158ac9a9837-59a4f7.png">
    const DEFAULT_CFG = { maxTemp: 26.5, maxHum: 60, minLux: 300, maxNoise: 58 };
    function getCfg() {
      try {
        const raw = localStorage.getItem('workwell_settings_v1');
        return raw ? { ...DEFAULT_CFG, ...JSON.parse(raw) } : DEFAULT_CFG;
      } catch { return DEFAULT_CFG; }
    }

    let activeKey = 'temp';
    let spikeMode = false;
    const series = {
      temp:  [23.1, 23.2, 23.3, 23.2, 23.4, 23.5, 23.3, 23.4],
      light: [420, 428, 430, 440, 432, 438, 434, 435],
      hum:   [47, 48, 48, 49, 48, 47, 48, 48],
      sound: [40, 41, 43, 42, 44, 41, 42, 42]
    };

    const META = {
      temp:  { label: 'Temperature Stream', unit: '°C', min: 18, max: 32, color: '#D97706', chipCls: 'bg-butter text-butter-ink', limitKey: 'maxTemp', prefix: 'Threshold max: ', beam: [164, 26] },
      light: { label: 'Ambient Light Stream', unit: ' lx', min: 100, max: 650, color: '#0284C7', chipCls: 'bg-sky text-sky-ink', limitKey: 'minLux', prefix: 'Threshold min: ', beam: [302, 164] },
      hum:   { label: 'Humidity Stream', unit: '%', min: 30, max: 80, color: '#059669', chipCls: 'bg-mint text-mint-ink', limitKey: 'maxHum', prefix: 'Threshold max: ', beam: [164, 302] },
      sound: { label: 'Acoustic Stream', unit: ' dBA', min: 30, max: 80, color: '#E11D48', chipCls: 'bg-coral-soft text-coral-ink', limitKey: 'maxNoise', prefix: 'Threshold max: ', beam: [26, 164] }
    };

    function selectStream(key) {
      activeKey = key;
      ['temp', 'light', 'hum', 'sound'].forEach(k => {
        const el = document.getElementById('lsat-' + k);
        if (k === key) { el.classList.add('border-electric', 'scale-105'); el.classList.remove('border-white'); }
        else { el.classList.remove('border-electric', 'scale-105'); el.classList.add('border-white'); }
      });
      render();
    }

    function sampleNow() {
      const cfg = getCfg();
      const next = {
        temp:  spikeMode ? +(cfg.maxTemp + 1.5).toFixed(1) : +(23.0 + Math.random() * 1.1).toFixed(1),
        light: spikeMode ? Math.max(170, cfg.minLux - 70) : Math.round(415 + Math.random() * 45),
        hum:   spikeMode ? Math.min(74, cfg.maxHum + 6) : Math.round(46 + Math.random() * 5),
        sound: spikeMode ? Math.min(76, cfg.maxNoise + 8) : Math.round(39 + Math.random() * 6)
      };
      Object.keys(next).forEach(k => { series[k].shift(); series[k].push(next[k]); });
      render();
    }

    function toggleSpike() {
      spikeMode = !spikeMode;
      document.getElementById('spike-btn').querySelector('span:last-child').textContent = spikeMode ? 'Calm' : 'Test';
      sampleNow();
    }

    function render() {
      const cfg = getCfg();
      const cur = {
        temp: series.temp[series.temp.length - 1],
        light: series.light[series.light.length - 1],
        hum: series.hum[series.hum.length - 1],
        sound: series.sound[series.sound.length - 1]
      };

      document.getElementById('lval-temp').textContent = cur.temp.toFixed(1) + '°C';
      document.getElementById('lval-light').textContent = cur.light + ' lx';
      document.getElementById('lval-hum').textContent = cur.hum + '%';
      document.getElementById('lval-sound').textContent = cur.sound + ' dBA';

      const alerts = [];
      if (cur.temp > cfg.maxTemp) alerts.push(`Temp ${cur.temp.toFixed(1)}°C > ${cfg.maxTemp}°C`);
      if (cur.sound > cfg.maxNoise) alerts.push(`Sound ${cur.sound} dBA > ${cfg.maxNoise} dBA`);
      if (cur.light < cfg.minLux) alerts.push(`Light ${cur.light} lx < ${cfg.minLux} lx`);
      if (cur.hum > cfg.maxHum) alerts.push(`Humid ${cur.hum}% > ${cfg.maxHum}%`);

      const banner = document.getElementById('alert-banner');
      const mascot = document.getElementById('live-mascot');
      const halo = document.getElementById('core-halo');
      const status = document.getElementById('core-status');

      if (alerts.length > 0) {
        banner.classList.remove('hidden');
        document.getElementById('alert-text').textContent = alerts[0];
        mascot.src = cur.temp > cfg.maxTemp ? 'https://lh3.googleusercontent.com/aida/ALJJyrAZMegn7O6aCJstm-NGjyFoFR56oPLOKNPp3G5YaSvVx8pSpAORcdg14GePlEKiZoXh724lyAQ87eDqA8HmwYksuTltpmGZn23qRQcCdonYmjzlUpoC_VlfStzS_EOJD5K8ZIBvEnkRPaPlFupyeu4Qqe46On0ROoj1WGyMk_ixWenL3tmifOz15tt8-9AvJH4jPzlMT33pyXrHdQtQfTrXoZ9hThiJMIYf7iTEKTnJ3piKTKxf2kZpYQ' : 'https://lh3.googleusercontent.com/aida/ALJJyrAnfDijCc4deybZQ-vcQCXWnFLlPnOzS5x0T_Bu9shHZErCddgpQjquR-mUPVOVcl7s0pzde-5VGApwdIMa8GGZBY0e-lRwa4SErnAIFB3L6jA0y4T7rj3yELgtmZtvGt2QU7lIVde75wDVNG2Fec76xG_LNjHWzP9fzhRxSDiwCXc1VlTnuCbLTBejq7Vz2W-wdKxzWSKHb6ewbthAk7YpC9r8zKxgg1KqNaIXKvz1jh4dIkhislFrlHc';
        halo.className = 'absolute -inset-1.5 rounded-full bg-coral-soft halo-pulse -z-10';
        status.className = 'rounded-full bg-coral-soft text-coral-ink px-2.5 py-0.5 text-[10px] font-extrabold';
        status.textContent = 'Alert';
      } else {
        banner.classList.add('hidden');
        mascot.src = 'https://lh3.googleusercontent.com/aida/ALJJyrCmgjxHmlwFQ1TgPiHybEwnh-tXDwAzzDC1G9HH3x8b3vpJZsdH1Lk-TO8vjQSQDLjxikZELXFnfz3C9JH2iamei8pIbtgtsoPzld_zKDrmGexYfFHK7y-G-eFrAqTPlutn7QdOwvp8NNMsuwITwXCaHq5m3UWXQJV11XaGNJ5sKlAMNCle1Sis4G54YhUvYnXPRuiZkr4Jo2-ERU_lsV4cfPZrVGdH3NOKPlfhlUv3YEgzQxH8NEyrng';
        halo.className = 'absolute -inset-1.5 rounded-full bg-mint-soft/75 halo-pulse -z-10';
        status.className = 'rounded-full bg-mint-soft text-mint-ink px-2.5 py-0.5 text-[10px] font-extrabold';
        status.textContent = 'All Clear';
      }

      const m = META[activeKey];
      const vals = series[activeKey];
      const limitVal = cfg[m.limitKey];

      document.getElementById('chart-title').textContent = m.label;
      document.getElementById('chart-sub').innerHTML = `${m.prefix}<span class="font-mono text-electric">${limitVal}${m.unit}</span>`;
      const nowEl = document.getElementById('chart-now');
      nowEl.textContent = (activeKey === 'temp' ? cur[activeKey].toFixed(1) : cur[activeKey]) + m.unit;
      nowEl.className = `rounded-full px-3 py-1 font-display text-sm font-bold tabular-nums ${m.chipCls}`;

      document.getElementById('live-beam').setAttribute('x2', m.beam[0]);
      document.getElementById('live-beam').setAttribute('y2', m.beam[1]);

      const W = 340, H = 100, padY = 12;
      const toY = v => Math.max(padY, Math.min(H - padY, H - padY - ((v - m.min) / (m.max - m.min)) * (H - padY * 2)));
      const pts = vals.map((v, i) => [Math.round((i / (vals.length - 1)) * (W - 20) + 10), Math.round(toY(v))]);
      let d = `M ${pts[0][0]} ${pts[0][1]}`;
      for (let i = 1; i < pts.length; i++) {
        const cx = (pts[i - 1][0] + pts[i][0]) / 2;
        d += ` C ${cx} ${pts[i - 1][1]}, ${cx} ${pts[i][1]}, ${pts[i][0]} ${pts[i][1]}`;
      }
      document.getElementById('wave-line').setAttribute('d', d);
      document.getElementById('wave-line').setAttribute('stroke', m.color);
      document.getElementById('wave-area').setAttribute('d', `${d} L ${pts[pts.length - 1][0]} ${H} L ${pts[0][0]} ${H} Z`);
      const last = pts[pts.length - 1];
      const dot = document.getElementById('wave-dot');
      dot.setAttribute('cx', last[0]);
      dot.setAttribute('cy', last[1]);
      dot.setAttribute('fill', m.color);
      const ly = Math.round(toY(limitVal));
      document.getElementById('limit-line').setAttribute('y1', ly);
      document.getElementById('limit-line').setAttribute('y2', ly);
    }

    render();
    setInterval(sampleNow, 2500);
  </script>
