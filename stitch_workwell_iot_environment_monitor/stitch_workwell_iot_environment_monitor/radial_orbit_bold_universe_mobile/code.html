        <!-- South: Humidity (Mint Droplet) -->

          <img src="https://lh3.googleusercontent.com/aida/ALJJyrDct13ao3u4V3ZunI3-Z7FDlxlIOmIr8ESlah-7Wd6cdC44aEqb5ujcffPqVBHVhnTFs4u-UqWM8eK0WbymW6VLBFHrCiU1GbgHlZz7yHWhxdYKtV7hX5CBfeM5Iou3zs33jBIoed1a-_c9NDUE_1bfITfGr9gssgWsTgbTS7lVM6KytCEQUzzwXwhFo4jO-G4QChXUY4wb9j7kD5kgE9YxT0DDUe1nPSEfOQdYrXZNNy_GNTT0BJPCJmT4F9Qt-LU" alt="Humidity" class="w-7 h-7 rounded-full object-cover bg-white">
          <span id="mval-hum" class="font-display text-sm font-bold text-ink tabular-nums">48%</span>
        </button>

        <!-- West: Acoustics (Coral Capsule) -->
        <button type="button" onclick="selectSensor(&#39;sound&#39;)" id="msat-sound" class="absolute top-1/2 -left-2 -translate-y-1/2 bg-coral-soft border-2 border-white rounded-full px-3 py-1.5 flex items-center gap-1.5 z-20 shadow-md transition-transform">
          <img src="https://lh3.googleusercontent.com/aida/ALJJyrCyBSkHZJ1WonMB5wWYgXLNq1FLG2aqmXeN5TGuK-QIPmYebfX7ZM3YmHWtXPmt1X7_kaEtsEA1G_XEDgqqS7otrOBRO4ulXfzbXfUUStAAdVsGe4IL2k07mvlIL1Y0e584IBsVsf5YSL48zJkQK6uB-F8u7CZF3ofSH9_8w7iuG7qc6ny1jFn2OK7l9QgX7LVuXAm9UA8hTedfWEmYiY7YvqPp0ouloLeSIq7GsgbIV1NqEU4Mu0UF90EiLIY" alt="Sound" class="w-7 h-7 rounded-full object-cover bg-white">
          <span id="mval-sound" class="font-display text-sm font-bold text-ink tabular-nums">42 dBA</span>
        </button>
      </section>

      <!-- Focused Sensor Telemetry Card -->
      <section class="w-full rounded-[32px] bg-white border-2 border-lilac p-4 flex flex-col gap-2.5 shadow-[0_10px_28px_rgba(108,60,233,0.08)]">
        <div class="flex items-center justify-between">
          <span id="minsp-chip" class="rounded-full bg-butter text-butter-ink px-3 py-0.5 text-[10px] font-extrabold uppercase tracking-wide">Temperature Focus</span>
          <span id="minsp-target" class="font-mono text-[11px] font-semibold text-mint-ink">Target 21–26°C</span>
        </div>
        <div class="flex items-baseline justify-between">
          <span id="minsp-reading" class="font-display text-3xl font-bold text-ink tabular-nums">23.4°C</span>
          <span id="minsp-hw" class="font-mono text-[10px] text-electric font-semibold">DHT22 · GPIO4</span>

        <p id="minsp-quote" class="text-xs font-bold text-ink bg-lilac-soft/75 rounded-2xl p-3 leading-snug">“Cozy thermal balance! Peekaboo is right at peak comfort.”</p>

      <!-- Peekaboo Tip Pill -->

        <p id="mob-tip" class="text-xs font-bold leading-snug flex-1">435 lx daylight is balanced — angle blinds at 2 PM.</p>
      </section>

    </main>

    <!-- Bottom Navigation -->
    <nav aria-label="Primary" class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t-2 border-lilac/60 px-2 py-2">

        <a href="#" aria-current="page" class="flex flex-col items-center py-1 rounded-full bg-electric text-white">
          <span class="material-symbols-outlined text-lg" style="font-variation-settings:&#39;FILL&#39; 1;">home</span>
          <span class="text-[10px] font-bold">Orbit</span>
        </a>
        <a href="../orbit-live-mobile/OrbitLiveMobile.html" class="flex flex-col items-center py-1 rounded-full text-muted">
          <span class="material-symbols-outlined text-lg">sensors</span>
          <span class="text-[10px] font-semibold">Live</span>
        </a>
        <a href="../orbit-playtime-mobile/OrbitPlaytimeMobile.html" class="flex flex-col items-center py-1 rounded-full text-muted">
          <span class="material-symbols-outlined text-lg">stadia_controller</span>
          <span class="text-[10px] font-semibold">Play</span>
        </a>
        <a href="../orbit-history-mobile/OrbitHistoryMobile.html" class="flex flex-col items-center py-1 rounded-full text-muted">
          <span class="material-symbols-outlined text-lg">insights</span>
          <span class="text-[10px] font-semibold">History</span>

        <a href="../orbit-settings-mobile/OrbitSettingsMobile.html" class="flex flex-col items-center py-1 rounded-full text-muted">

          <span class="text-[10px] font-semibold">Settings</span>

  <script data-stitch-original-script="aba8a6f893e6072d===../../uploads/a7c9af00-3c36-41bb-a7dc-c158ac9a9837-59a4f7.png|||61b3c1bf337dd8bb===../../uploads/65ea6de9-2ee9-47ac-bfd5-0a02930ff8c7-61db22.png|||311a929320a2de8f===../../uploads/79ed381d-52f4-40b9-a45b-8b6831f801b5-6c99de.png|||bb85c4b54c8d6b6d===../../uploads/d8681424-c7b9-4070-94d5-6ea55b7b0d30-d4ef4a.png">
    const MOODS = {
      optimal: { score: 92, badge: '92% Optimal', mascot: 'https://lh3.googleusercontent.com/aida/ALJJyrCmgjxHmlwFQ1TgPiHybEwnh-tXDwAzzDC1G9HH3x8b3vpJZsdH1Lk-TO8vjQSQDLjxikZELXFnfz3C9JH2iamei8pIbtgtsoPzld_zKDrmGexYfFHK7y-G-eFrAqTPlutn7QdOwvp8NNMsuwITwXCaHq5m3UWXQJV11XaGNJ5sKlAMNCle1Sis4G54YhUvYnXPRuiZkr4Jo2-ERU_lsV4cfPZrVGdH3NOKPlfhlUv3YEgzQxH8NEyrng', vals: { temp: '23.4°C', light: '435 lx', hum: '48%', sound: '42 dBA' }, tip: '435 lx daylight is balanced — angle blinds at 2 PM.' },
      warm:    { score: 74, badge: '74% Warm',    mascot: 'https://lh3.googleusercontent.com/aida/ALJJyrAZMegn7O6aCJstm-NGjyFoFR56oPLOKNPp3G5YaSvVx8pSpAORcdg14GePlEKiZoXh724lyAQ87eDqA8HmwYksuTltpmGZn23qRQcCdonYmjzlUpoC_VlfStzS_EOJD5K8ZIBvEnkRPaPlFupyeu4Qqe46On0ROoj1WGyMk_ixWenL3tmifOz15tt8-9AvJH4jPzlMT33pyXrHdQtQfTrXoZ9hThiJMIYf7iTEKTnJ3piKTKxf2kZpYQ', vals: { temp: '27.6°C', light: '510 lx', hum: '54%', sound: '44 dBA' }, tip: '27.6°C is warm — open a window or turn on a fan.' },
      dim:     { score: 79, badge: '79% Dim',     mascot: 'https://lh3.googleusercontent.com/aida/ALJJyrDgkfgzeI1melaNvhl8WpWGz3x7TE6EZuPnBNJLnk5aD3jaBuwbUptz1YKxhLHOdVvsSEM8CdSmJEflkUoVWK2C0_JVsRG6uvgtA8bf557P7zyYH6lK151PDBBo_WHpfFbzQdx5-O-t-qZOpsgKs5JYxfuYPsXXk2dzrhmwncngPNsFfxx_2Ze1xqJOXu7pLKBjXNUmhft1CVGGfpyjxb3mcksSGFa40NIPcsoKKGXGQ1UEJIHvZZQs8gg', vals: { temp: '22.8°C', light: '185 lx', hum: '47%', sound: '38 dBA' }, tip: '185 lx is low — switch on your warm desk lamp.' },
      loud:    { score: 71, badge: '71% Loud',    mascot: 'https://lh3.googleusercontent.com/aida/ALJJyrAnfDijCc4deybZQ-vcQCXWnFLlPnOzS5x0T_Bu9shHZErCddgpQjquR-mUPVOVcl7s0pzde-5VGApwdIMa8GGZBY0e-lRwa4SErnAIFB3L6jA0y4T7rj3yELgtmZtvGt2QU7lIVde75wDVNG2Fec76xG_LNjHWzP9fzhRxSDiwCXc1VlTnuCbLTBejq7Vz2W-wdKxzWSKHb6ewbthAk7YpC9r8zKxgg1KqNaIXKvz1jh4dIkhislFrlHc', vals: { temp: '23.5°C', light: '430 lx', hum: '49%', sound: '64 dBA' }, tip: '64 dBA is noisy — try headphones for deep focus.' }
    };

    const SENSORS = {
      temp:  { chip: 'Temperature Focus', target: 'Target 21–26°C', hw: 'DHT22 · GPIO4', chipCls: 'bg-butter text-butter-ink', beam: [168, 28], quote: '“Cozy thermal balance! Peekaboo is right at peak comfort.”' },
      light: { chip: 'Daylight Focus', target: 'Target 300–550 lx', hw: 'BH1750 · I2C', chipCls: 'bg-sky text-sky-ink', beam: [308, 168], quote: '“Crisp natural daylight keeps eye strain away.”' },
      hum:   { chip: 'Humidity Focus', target: 'Target 40–60%', hw: 'DHT22 · GPIO4', chipCls: 'bg-mint text-mint-ink', beam: [168, 308], quote: '“Fresh 48% humidity — breathable and gentle.”' },
      sound: { chip: 'Acoustics Focus', target: 'Target ≤ 55 dBA', hw: 'MAX4466 · ADC', chipCls: 'bg-coral-soft text-coral-ink', beam: [28, 168], quote: '“Soft 42 dBA hum — great for deep focus!”' }
    };

    let currentMood = 'optimal';
    let activeSensor = 'temp';

    function setMood(m) {
      currentMood = m;
      ['optimal', 'warm', 'dim', 'loud'].forEach(k => {
        document.getElementById('mm-' + k).className = k === m
          ? 'rounded-full px-3 py-1 bg-electric text-white text-[11px] font-bold shrink-0'
          : 'rounded-full px-3 py-1 bg-white text-muted text-[11px] font-bold shrink-0';
      });
      render();
    }

    function selectSensor(s) {
      activeSensor = s;
      ['temp', 'light', 'hum', 'sound'].forEach(k => {
        const el = document.getElementById('msat-' + k);
        if (k === s) {
          el.classList.add('border-electric', 'scale-105');
          el.classList.remove('border-white');
        } else {
          el.classList.remove('border-electric', 'scale-105');
          el.classList.add('border-white');
        }
      });
      render();
    }

    function render() {
      const m = MOODS[currentMood];
      const s = SENSORS[activeSensor];
      document.getElementById('mob-badge').textContent = m.badge;
      document.getElementById('mob-score').textContent = m.score + '%';
      document.getElementById('mob-arc').setAttribute('stroke-dashoffset', Math.round(515 * (1 - m.score / 100)));
      document.getElementById('mob-mascot').src = m.mascot;
      document.getElementById('mob-tip').textContent = m.tip;

      document.getElementById('mval-temp').textContent = m.vals.temp;
      document.getElementById('mval-light').textContent = m.vals.light;
      document.getElementById('mval-hum').textContent = m.vals.hum;
      document.getElementById('mval-sound').textContent = m.vals.sound;

      const chip = document.getElementById('minsp-chip');
      chip.textContent = s.chip;
      chip.className = `rounded-full px-3 py-0.5 text-[10px] font-extrabold uppercase tracking-wide ${s.chipCls}`;
      document.getElementById('minsp-target').textContent = s.target;
      document.getElementById('minsp-reading').textContent = m.vals[activeSensor];
      document.getElementById('minsp-hw').textContent = s.hw;
      document.getElementById('minsp-quote').textContent = s.quote;

      const beam = document.getElementById('mob-beam');
      beam.setAttribute('x2', s.beam[0]);
      beam.setAttribute('y2', s.beam[1]);
    }

    render();
  </script>
