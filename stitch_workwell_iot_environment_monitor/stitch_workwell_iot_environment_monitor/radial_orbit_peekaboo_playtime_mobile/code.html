<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peekaboo Playtime — WorkWell Radial Orbit (Mobile)</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#F6F3FF', ink: '#1E1633', muted: '#62587D', electric: '#6C3CE9',
            lilac: '#D8CCFF', 'lilac-soft': '#ECE6FF', butter: '#FFE066', 'butter-ink': '#7A4E00',
            coral: '#FF7B93', 'coral-soft': '#FFD6DE', 'coral-ink': '#941736',
            mint: '#8EF0C4', 'mint-soft': '#D5FBE9', 'mint-ink': '#0B5D3B',
            sky: '#99DDFF', 'sky-soft': '#DCF4FF', 'sky-ink': '#0A557A'
          },
          fontFamily: { display: ['Fredoka', 'system-ui', 'sans-serif'], sans: ['Nunito', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; overflow: hidden; white-space: nowrap; vertical-align: middle; }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 100% { opacity: 0; transform: translateY(-40px) scale(1.2); } }
    .ring-spin { animation: spinSlow 44s linear infinite; }
    .heart-pop { animation: floatUp 0.9s ease-out forwards; }
  </style>
</head>
<body class="bg-canvas text-ink font-sans antialiased pb-24 overflow-x-hidden">
  <div class="min-h-[884px] max-w-md mx-auto flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Header + Progression -->
    <header class="px-5 pt-4 pb-2 flex items-center justify-between gap-2">
      <div>
        <h1 class="font-display text-xl text-ink leading-none">Peekaboo Playtime</h1>
        <span class="text-[11px] font-semibold text-muted">Relaxed companion · No decay</span>
      </div>
      <div class="rounded-full bg-white border-2 border-lilac px-3 py-1 flex items-center gap-2">
        <span id="lvl-label" class="font-display text-xs text-electric">Lv. 4</span>
        <span id="xp-label" class="font-mono text-[10px] text-muted">140/200</span>
      </div>
    </header>

    <main class="px-4 py-2 flex flex-col items-center gap-4">

      <!-- Interactive Peekaboo Orbit -->
      <section class="relative w-[300px] h-[300px] flex items-center justify-center my-1">
        <div class="absolute inset-2 rounded-full bg-lilac-soft pointer-events-none"></div>
        <svg viewBox="0 0 300 300" class="absolute inset-0 w-full h-full pointer-events-none">
          <circle cx="150" cy="150" r="136" fill="none" stroke="#6C3CE9" stroke-width="2" stroke-dasharray="6 8" opacity="0.28" class="origin-center ring-spin"></circle>
          <circle cx="150" cy="150" r="104" fill="none" stroke="#B79EFF" stroke-width="2.5" opacity="0.55"></circle>
        </svg>

        <!-- Equipped Deco Badges -->
        <span id="deco-sprout" class="hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-mint border-2 border-white rounded-full px-3 py-0.5 text-[10px] font-extrabold text-mint-ink z-20 shadow">Sprout</span>
        <span id="deco-lamp" class="hidden absolute top-1/2 -right-2 -translate-y-1/2 bg-butter border-2 border-white rounded-full px-3 py-0.5 text-[10px] font-extrabold text-butter-ink z-20 shadow">Lamp</span>
        <span id="deco-cushion" class="hidden absolute -bottom-2 left-1/2 -translate-x-1/2 bg-coral-soft border-2 border-white rounded-full px-3 py-0.5 text-[10px] font-extrabold text-coral-ink z-20 shadow">Cushion</span>
        <span id="deco-star" class="hidden absolute top-1/2 -left-2 -translate-y-1/2 bg-sky border-2 border-white rounded-full px-3 py-0.5 text-[10px] font-extrabold text-sky-ink z-20 shadow">Stars</span>

        <button type="button" onclick="petPeekaboo()" class="relative w-40 h-40 rounded-full bg-white border-4 border-electric/25 flex flex-col items-center justify-center text-center p-3 z-10 shadow-lg active:scale-95 transition-transform">
          <div id="hearts-layer" class="absolute inset-0 pointer-events-none overflow-visible"></div>
          <span id="companion-state" class="rounded-full bg-butter text-butter-ink px-2.5 py-0.5 text-[10px] font-extrabold mb-1">Tap to Pet</span>
          <img id="play-mascot" src="https://lh3.googleusercontent.com/aida/ALJJyrAnfDijCc4deybZQ-vcQCXWnFLlPnOzS5x0T_Bu9shHZErCddgpQjquR-mUPVOVcl7s0pzde-5VGApwdIMa8GGZBY0e-lRwa4SErnAIFB3L6jA0y4T7rj3yELgtmZtvGt2QU7lIVde75wDVNG2Fec76xG_LNjHWzP9fzhRxSDiwCXc1VlTnuCbLTBejq7Vz2W-wdKxzWSKHb6ewbthAk7YpC9r8zKxgg1KqNaIXKvz1jh4dIkhislFrlHc" alt="Peekaboo" class="w-20 h-20 rounded-full object-contain bg-white p-1">
        </button>
      </section>

      <!-- Speech Bubble -->
      <p id="play-speech" class="w-full rounded-full bg-electric text-white px-4 py-2.5 text-center text-xs font-bold shadow-md">“Tap me for a cozy high-five, or pick a snack below!”</p>

      <!-- Mobile Activity Tabs -->
      <section class="w-full rounded-[32px] bg-white border-2 border-lilac p-4 flex flex-col gap-3 shadow-[0_10px_28px_rgba(108,60,233,0.08)]">
        <div class="grid grid-cols-3 gap-1 bg-lilac-soft/75 p-1 rounded-full">
          <button type="button" onclick="setTab(&#39;feed&#39;)" id="tab-feed" class="rounded-full py-1.5 bg-electric text-white text-[11px] font-bold">Feed</button>
          <button type="button" onclick="setTab(&#39;habitat&#39;)" id="tab-habitat" class="rounded-full py-1.5 text-muted text-[11px] font-bold">Habitat</button>
          <button type="button" onclick="setTab(&#39;log&#39;)" id="tab-log" class="rounded-full py-1.5 text-muted text-[11px] font-bold">History</button>
        </div>

        <div id="panel-feed" class="grid grid-cols-2 gap-2.5">
          <button type="button" onclick="feedTreat(&#39;Lavender Berry&#39;, &#39;a7c9af00-3c36-41bb-a7dc-c158ac9a9837-59a4f7.png&#39;, &#39;“Sweet lavender berries! +15 XP”&#39;)" class="rounded-[22px] bg-lilac-soft p-3 text-left flex items-center gap-2">
            <span class="material-symbols-outlined text-electric text-xl">nutrition</span>
            <div><span class="font-display text-xs text-ink block">Berry</span><span class="text-[10px] font-bold text-electric">+15 XP</span></div>
          </button>
          <button type="button" onclick="feedTreat(&#39;Honey Toast&#39;, &#39;c6130dfb-3f11-4ab7-aa1f-a4ebeeddc463-0ab66b.png&#39;, &#39;“Warm honey toast! +15 XP”&#39;)" class="rounded-[22px] bg-butter/85 p-3 text-left flex items-center gap-2">
            <span class="material-symbols-outlined text-butter-ink text-xl">bakery_dining</span>
            <div><span class="font-display text-xs text-ink block">Toast</span><span class="text-[10px] font-bold text-butter-ink">+15 XP</span></div>
          </button>
          <button type="button" onclick="feedTreat(&#39;Mint Tea&#39;, &#39;65ea6de9-2ee9-47ac-bfd5-0a02930ff8c7-61db22.png&#39;, &#39;“Refreshing mint tea! +15 XP”&#39;)" class="rounded-[22px] bg-mint-soft p-3 text-left flex items-center gap-2">
            <span class="material-symbols-outlined text-mint-ink text-xl">emoji_food_beverage</span>
            <div><span class="font-display text-xs text-ink block">Mint Tea</span><span class="text-[10px] font-bold text-mint-ink">+15 XP</span></div>
          </button>
          <button type="button" onclick="feedTreat(&#39;Star Biscuit&#39;, &#39;d8681424-c7b9-4070-94d5-6ea55b7b0d30-d4ef4a.png&#39;, &#39;“Sparkly star biscuit! +15 XP”&#39;)" class="rounded-[22px] bg-sky-soft p-3 text-left flex items-center gap-2">
            <span class="material-symbols-outlined text-sky-ink text-xl">cookie</span>
            <div><span class="font-display text-xs text-ink block">Biscuit</span><span class="text-[10px] font-bold text-sky-ink">+15 XP</span></div>
          </button>
        </div>

        <div id="panel-habitat" class="hidden grid grid-cols-2 gap-2.5">
          <button type="button" onclick="toggleDeco(&#39;sprout&#39;)" class="rounded-[20px] bg-mint-soft p-3 text-xs font-extrabold text-mint-ink">Toggle Sprout</button>
          <button type="button" onclick="toggleDeco(&#39;lamp&#39;)" class="rounded-[20px] bg-butter/85 p-3 text-xs font-extrabold text-butter-ink">Toggle Lamp</button>
          <button type="button" onclick="toggleDeco(&#39;cushion&#39;)" class="rounded-[20px] bg-coral-soft p-3 text-xs font-extrabold text-coral-ink">Toggle Cushion</button>
          <button type="button" onclick="toggleDeco(&#39;star&#39;)" class="rounded-[20px] bg-sky-soft p-3 text-xs font-extrabold text-sky-ink">Toggle Stars</button>
        </div>

        <ul id="panel-log" class="hidden flex flex-col gap-1.5 text-xs font-semibold text-ink"></ul>
      </section>

    </main>

    <!-- 5-Tab Bottom Navigation -->
    <nav aria-label="Primary" class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t-2 border-lilac/60 px-2 py-2">
      <div class="grid grid-cols-5 gap-1 max-w-md mx-auto">
        <a href="../orbit-bold-mobile/OrbitBoldMobile.html" class="flex flex-col items-center py-1 rounded-full text-muted">
          <span class="material-symbols-outlined text-lg">home</span><span class="text-[10px] font-semibold">Orbit</span>
        </a>
        <a href="../orbit-live-mobile/OrbitLiveMobile.html" class="flex flex-col items-center py-1 rounded-full text-muted">
          <span class="material-symbols-outlined text-lg">sensors</span><span class="text-[10px] font-semibold">Live</span>
        </a>
        <a href="#" aria-current="page" class="flex flex-col items-center py-1 rounded-full bg-electric text-white">
          <span class="material-symbols-outlined text-lg" style="font-variation-settings:&#39;FILL&#39; 1;">stadia_controller</span><span class="text-[10px] font-bold">Play</span>
        </a>
        <a href="../orbit-history-mobile/OrbitHistoryMobile.html" class="flex flex-col items-center py-1 rounded-full text-muted">
          <span class="material-symbols-outlined text-lg">insights</span><span class="text-[10px] font-semibold">History</span>
        </a>
        <a href="../orbit-settings-mobile/OrbitSettingsMobile.html" class="flex flex-col items-center py-1 rounded-full text-muted">
          <span class="material-symbols-outlined text-lg">tune</span><span class="text-[10px] font-semibold">Settings</span>
        </a>
      </div>
    </nav>
  </div>

  <script data-stitch-original-script="aba8a6f893e6072d===../../uploads/a7c9af00-3c36-41bb-a7dc-c158ac9a9837-59a4f7.png">
    const DEFAULT_STATE = {
      xp: 140, level: 4,
      decos: { sprout: true, lamp: false, cushion: false, star: false },
      log: ['Shared Lavender Berry (+15 XP)', 'Petted Peekaboo (+10 XP)']
    };
    function loadState() {
      try {
        const raw = localStorage.getItem('workwell_peekaboo_v1');
        return raw ? { ...DEFAULT_STATE, ...JSON.parse(raw) } : DEFAULT_STATE;
      } catch { return DEFAULT_STATE; }
    }
    let state = loadState();
    function saveState() { try { localStorage.setItem('workwell_peekaboo_v1', JSON.stringify(state)); } catch {} }

    function addXp(amount, entry) {
      state.xp += amount;
      while (state.xp >= 200) { state.xp -= 200; state.level += 1; }
      if (entry) { state.log.unshift(entry); state.log = state.log.slice(0, 4); }
      saveState();
      render();
    }

    function render() {
      document.getElementById('lvl-label').textContent = `Lv. ${state.level}`;
      document.getElementById('xp-label').textContent = `${state.xp}/200`;
      document.getElementById('panel-log').innerHTML = state.log.map(i => `<li class="rounded-xl bg-canvas px-3 py-2">${i}</li>`).join('');
      Object.keys(state.decos).forEach(k => document.getElementById('deco-' + k).classList.toggle('hidden', !state.decos[k]));
    }

    function setTab(t) {
      ['feed', 'habitat', 'log'].forEach(k => {
        document.getElementById('panel-' + k).classList.toggle('hidden', k !== t);
        document.getElementById('tab-' + k).className = k === t
          ? 'rounded-full py-1.5 bg-electric text-white text-[11px] font-bold'
          : 'rounded-full py-1.5 text-muted text-[11px] font-bold';
      });
    }

    function petPeekaboo() {
      const hearts = document.getElementById('hearts-layer');
      const h = document.createElement('span');
      h.className = 'material-symbols-outlined text-coral text-xl absolute heart-pop';
      h.style.left = '45%'; h.style.top = '25%'; h.style.fontVariationSettings = "'FILL' 1";
      h.textContent = 'favorite';
      hearts.appendChild(h);
      setTimeout(() => h.remove(), 900);
      document.getElementById('play-mascot').src = 'https://lh3.googleusercontent.com/aida/ALJJyrCmgjxHmlwFQ1TgPiHybEwnh-tXDwAzzDC1G9HH3x8b3vpJZsdH1Lk-TO8vjQSQDLjxikZELXFnfz3C9JH2iamei8pIbtgtsoPzld_zKDrmGexYfFHK7y-G-eFrAqTPlutn7QdOwvp8NNMsuwITwXCaHq5m3UWXQJV11XaGNJ5sKlAMNCle1Sis4G54YhUvYnXPRuiZkr4Jo2-ERU_lsV4cfPZrVGdH3NOKPlfhlUv3YEgzQxH8NEyrng';
      document.getElementById('play-speech').textContent = '“Hehe, cozy high-five! +10 Affection XP”';
      addXp(10, 'Petted Peekaboo (+10 XP)');
    }

    function feedTreat(name, img, quote) {
      document.getElementById('play-mascot').src = `../../uploads/${img}`;
      document.getElementById('play-speech').textContent = quote;
      addXp(15, `Shared ${name} (+15 XP)`);
    }

    function toggleDeco(k) { state.decos[k] = !state.decos[k]; saveState(); render(); }

    render();
  </script>


</body></html>
